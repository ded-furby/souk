<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#000}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// Renders a piece the way the game lights it (ACES, sRGB, room environment) and exports the GLB.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { bake, stats } from './lib.mjs';

const VIEWS = {
  front: [0, 0, 1], back: [0, 0, -1], left: [-1, 0.05, 0], right: [1, 0.05, 0], top: [0, 1, 0.001], bottom: [0, -1, 0.001],
  threeq: [0.72, 0.28, 0.75], threeqLeft: [-0.72, 0.28, 0.75], low: [0.35, -0.35, 0.9],
};

function grab(renderer, size) {
  const gl = renderer.getContext(), px = new Uint8Array(size * size * 4);
  gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d'), img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) img.data.set(px.subarray((size - 1 - y) * size * 4, (size - y) * size * 4), y * size * 4);
  ctx.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}

window.__run = async ({ piece, views, size, glb, bg, zoom }) => {
  const mod = await import(`./pieces/${piece}.mjs?v=${Date.now()}`);
  const obj = bake(await mod.build());
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(size, size);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(bg || '#17120d');
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.85;
  const key = new THREE.DirectionalLight('#ffe3bd', 2.4); key.position.set(1.4, 2.0, 2.6); scene.add(key);
  const rim = new THREE.DirectionalLight('#ffcf94', 1.3); rim.position.set(-2.2, 1.2, -1.8); scene.add(rim);
  scene.add(obj);
  const sphere = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
  const cam = new THREE.PerspectiveCamera(28, 1, sphere.radius / 50, sphere.radius * 50);
  const dist = (sphere.radius / Math.sin(THREE.MathUtils.degToRad(14))) * 1.04 / (zoom || 1);
  const images = {};
  for (const v of views) {
    const d = new THREE.Vector3(...(VIEWS[v] || VIEWS.front)).normalize();
    cam.position.copy(sphere.center).addScaledVector(d, dist);
    cam.up.set(0, v === 'top' || v === 'bottom' ? 0 : 1, v === 'top' ? -1 : v === 'bottom' ? 1 : 0);
    cam.lookAt(sphere.center);
    renderer.render(scene, cam);
    images[v] = grab(renderer, size); // canvas.toDataURL() returns a stale frame in headless Chrome
  }
  let glbB64 = null;
  if (glb) {
    const buf = await new GLTFExporter().parseAsync(obj, { binary: true });
    let s = '';
    const u8 = new Uint8Array(buf);
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    glbB64 = btoa(s);
  }
  const parts = [];
  obj.traverse((n) => n !== obj && !n.isMesh && parts.push(n.name));
  return { images, glb: glbB64, stats: { ...stats(obj), parts } };
};
window.__ready = true;
</script>
</body>
</html>
